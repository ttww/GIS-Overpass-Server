# Geofabrik region catalog for GIS-Overpass-Server
#
# Format (pipe-delimited, no spaces around "|"):
#   key|pbf_url|diff_url
#
# key       - lowercase identifier used everywhere (container name, data dir, bin/* argument)
# pbf_url   - Geofabrik .osm.pbf extract for this region
# diff_url  - Geofabrik replication ("-updates") directory for this region (osmosis-compatible,
#             trailing slash required)
#
# To add another region:
#   1. Find it at https://download.geofabrik.de (browse) or https://download.geofabrik.de/index-v1.json
#   2. Take the "pbf" and "updates" values from that entry (append a trailing "/" to updates)
#   3. Add one line below. No code changes needed.
#
# Lines starting with "#" and blank lines are ignored.

italy|https://download.geofabrik.de/europe/italy-latest.osm.pbf|https://download.geofabrik.de/europe/italy-updates/
germany|https://download.geofabrik.de/europe/germany-latest.osm.pbf|https://download.geofabrik.de/europe/germany-updates/
austria|https://download.geofabrik.de/europe/austria-latest.osm.pbf|https://download.geofabrik.de/europe/austria-updates/
switzerland|https://download.geofabrik.de/europe/switzerland-latest.osm.pbf|https://download.geofabrik.de/europe/switzerland-updates/
czech-republic|https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf|https://download.geofabrik.de/europe/czech-republic-updates/
france|https://download.geofabrik.de/europe/france-latest.osm.pbf|https://download.geofabrik.de/europe/france-updates/
